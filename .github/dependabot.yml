version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/sisap-by-cenivra-—-sistema-de-información-clínica-y-gobernanza"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      react-and-vite:
        patterns:
          - "react*"
          - "vite*"
          - "@vitejs/*"
          - "@tailwindcss/*"
      dev-tooling:
        dependency-type: "development"
    labels:
      - "dependencies"
      - "SOUP-review"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
